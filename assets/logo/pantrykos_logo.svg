<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Midnight Navy Squircle Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#172544" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>

    <!-- Glowing Sapphire-Cyan Border -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="55%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Bowl Stroke Gradient -->
    <linearGradient id="bowlStroke" x1="102" y1="276" x2="410" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Bowl Inner Fill -->
    <linearGradient id="bowlFill" x1="256" y1="276" x2="256" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.10" />
    </linearGradient>

    <!-- Neon Emerald Leaf Gradient -->
    <linearGradient id="emeraldLeaf" x1="374" y1="128" x2="266" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Ambient Radial Glow -->
    <radialGradient id="ambientGlow" cx="190" cy="150" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#06B6D4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0A0F1D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="144" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14" />
  <rect x="16" y="16" width="480" height="480" rx="144" fill="url(#ambientGlow)" />

  <!-- Minimalist Culinary Bowl Fill -->
  <path d="M112 276 A144 124 0 0 0 400 276 Z" fill="url(#bowlFill)" />

  <!-- Minimalist Culinary Bowl Rim & Arc -->
  <path d="M102 276 H410 M112 276 A144 124 0 0 0 400 276" stroke="url(#bowlStroke)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bowl Base Pedestal Line -->
  <line x1="194" y1="426" x2="318" y2="426" stroke="url(#bowlStroke)" stroke-width="32" stroke-linecap="round" />

  <!-- Neon Emerald Freshness Leaf -->
  <path d="M266 252 Q276 142 374 128 Q362 228 266 252 Z" fill="url(#emeraldLeaf)" />

  <!-- 4-Point AI Sparkle Star -->
  <path d="M180 96 Q180 158 242 158 Q180 158 180 220 Q180 158 118 158 Q180 158 180 96 Z" fill="#F8FAFC" />
</svg>

